# GoReleaser — release configuration for aws-tui.
# Schema v2 (GoReleaser >= 2.0). Docs: https://goreleaser.com
#
# Local usage (test, without publishing):
#   goreleaser release --snapshot --clean --skip=publish
# Real release (triggered by CI on a vX.Y.Z tag):
#   goreleaser release --clean
version: 2

project_name: aws-tui

before:
  hooks:
    - go mod tidy
    - go vet ./...

builds:
  - id: aws-tui
    main: .
    binary: aws-tui
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .ShortCommit }}
      - -X main.date={{ .CommitDate }}
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    # Windows arm64 is not published (uncommon; can be emulated via amd64).
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: default
    ids:
      - aws-tui
    # Name aligned with the install scripts:
    #   aws-tui_<version>_<os>_<arch>(.tar.gz|.zip)
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE*

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "merge conflict"
      - Merge pull request
      - Merge branch

# Native Linux packages (.deb / .rpm). No external repository required: they are
# simply attached to the GitHub release. Requires nfpm (bundled with GoReleaser).
nfpms:
  - id: linux-packages
    package_name: aws-tui
    ids:
      - aws-tui
    vendor: VeugDamien
    homepage: https://github.com/VeugDamien/aws-tui
    maintainer: VeugDamien <noreply@users.noreply.github.com>
    description: |
      Terminal UI (TUI) to manage AWS profiles, list EC2 instances, Auto Scaling
      Groups and Load Balancers, and start SSM sessions (shell / port-forward).
    license: MIT
    formats:
      - deb
      - rpm
    bindir: /usr/bin
    # Recommended runtime dependencies (non-blocking depending on the manager).
    recommends:
      - awscli

release:
  github:
    owner: VeugDamien
    name: aws-tui
  draft: false
  prerelease: auto
  name_template: "aws-tui {{ .Tag }}"
  footer: |
    ## Installation

    **macOS / Linux:**
    ```sh
    curl -fsSL https://raw.githubusercontent.com/VeugDamien/aws-tui/main/scripts/install.sh | sh
    ```

    **Windows (PowerShell):**
    ```powershell
    irm https://raw.githubusercontent.com/VeugDamien/aws-tui/main/scripts/install.ps1 | iex
    ```

    Otherwise, download the archive for your platform below.

# ---------------------------------------------------------------------------
# Package manager integrations — DISABLED.
#
# Each requires a separate Git repository (to create) and a GitHub token
# (`GORELEASER_TOKEN` secret or a PAT with write access to the tap/bucket repo).
# Uncomment and create the repositories to enable them.
# ---------------------------------------------------------------------------

# Homebrew cask published to the VeugDamien/homebrew-tap repository. Casks are the
# current GoReleaser way to distribute pre-compiled binaries (the old `brews`
# section is deprecated). Install with: brew install VeugDamien/tap/aws-tui
homebrew_casks:
  - name: aws-tui
    ids:
      - default
    binaries:
      - aws-tui
    repository:
      owner: VeugDamien
      name: homebrew-tap
      token: "{{ .Env.GORELEASER_TOKEN }}"
    homepage: https://github.com/VeugDamien/aws-tui
    description: "TUI to manage AWS (profiles, EC2, ASG, Load Balancers, SSM)."
    dependencies:
      - formula: awscli
    # The binary is not code-signed, so macOS would quarantine it ("app is
    # damaged"). Strip the quarantine attribute on install until proper signing
    # (notarization) is set up. The cask installs on both macOS and Linux, so the
    # hook body guards with `OS.mac?` (plain Ruby) — `on_macos` is NOT valid
    # inside a postflight block and makes the install fail.
    #
    # NOTE: `install:` generates a `postflight` stanza, which recent Homebrew
    # deprecates in favor of `postflight_steps` (harmless warning on install).
    # GoReleaser only emits `postflight_steps` via `install_steps:`, available
    # from v2.19. Once the release workflow runs GoReleaser >= v2.19, switch
    # `install:` to `install_steps:` below to silence the warning.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr",
                           args: ["-dr", "com.apple.quarantine", "#{staged_path}/aws-tui"]
          end

