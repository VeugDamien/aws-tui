name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # required to create the GitHub Release and attach artifacts

jobs:
  goreleaser:
    name: Build & publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history required by GoReleaser for the changelog.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # To enable Homebrew/Scoop (separate repositories), provide a PAT and
          # uncomment the line below plus the brews/scoops sections in
          # .goreleaser.yaml:
          # GORELEASER_TOKEN: ${{ secrets.GORELEASER_TOKEN }}
