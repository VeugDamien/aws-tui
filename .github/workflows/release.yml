name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # requis pour créer la Release GitHub et y attacher les artefacts

jobs:
  goreleaser:
    name: Build & publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Historique complet requis par GoReleaser pour le changelog.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pour activer Homebrew/Scoop (dépôts annexes), fournissez un PAT et
          # décommentez la ligne suivante ainsi que les sections brews/scoops
          # dans .goreleaser.yaml :
          # GORELEASER_TOKEN: ${{ secrets.GORELEASER_TOKEN }}
