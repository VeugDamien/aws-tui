# Dependabot keeps Go modules and GitHub Actions up to date.
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates
version: 2
updates:
  # Go module dependencies.
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      # Batch AWS SDK bumps into a single PR to reduce noise.
      aws-sdk:
        patterns:
          - "github.com/aws/aws-sdk-go-v2*"
      # Batch Charmbracelet (Bubble Tea) bumps together.
      charmbracelet:
        patterns:
          - "github.com/charmbracelet/*"

  # GitHub Actions used in workflows.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
